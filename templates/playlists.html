<section class="flexcol" autocomplete='off' onsubmit="event.preventDefault();">
	<header class="flex0">
		<p>{{localize 'QuickCombat.playlist.intro1'}}</p>
		<p>{{localize 'QuickCombat.playlist.intro2'}}</p>
		<p>{{localize 'QuickCombat.playlist.intro3'}}</p>
	</header>
	<section class="content">
		<ol class="table-results">
			<li class="table-result table-header flexrow">
				<div class="result-input">
					<label>{{localize 'QuickCombat.playlist.label'}}</label>
				</div>
				<div class="result-input">
					<label>{{localize 'QuickCombat.scene.label'}}</label>
				</div>
				<div class="result-check">
					<label>{{localize 'QuickCombat.fanfare.label'}}</label>
				</div>
				<div class="result-controls">
					<label>{{localize 'QuickCombat.remove.label'}}</label>
				</div>
			</li>
			{{#each playlists as |playlist idx|}}
			<li class="table-result flexrow">
				<div class="result-input">
					<div class="form-group">
						<select name="{{idx}}.id">
							{{#each playlist.playlist_ids as | p|}}
								<option value="{{p.id}}" {{#if p.selected}} selected {{/if}} {{#if p.empty}} title="{{localize 'QuickCombat.playlist.empty'}}" {{/if}}>{{p.name}} {{#if p.empty}}{!}{{/if}}</option>
							{{/each}}
						</select>
					</div>
				</div>
				<div class="result-input">
					<div class='form-group'>
						<select name="{{idx}}.scene">
							<option value=""></option>
							{{#each playlist.scene_ids as | s|}}
								{{#if s.selected}}
									<option value="{{s.id}}" selected>
								{{else}}
									<option value="{{s.id}}">
								{{/if}}
									{{s.name}}
								</option>
							{{/each}}
						</select>
					</div>
				</div>
				<div class="result-check">
					<div class='form-group'>
						{{#if playlist.fanfare}}
						<input type='checkbox' name="{{idx}}.fanfare" checked>
						{{else}}
						<input type='checkbox' name="{{idx}}.fanfare">
						{{/if}}
					</div>
				</div>
				<button class="result-controls" data-action="removePlaylist" data-idx="{{idx}}">
					<i class='far fa-trash-alt'></i>
				</button>
			</li>
			{{/each}}
		</ol>
	</section>
	<footer>
		<button class="actionButtons" data-action="savePlaylists">
			<i class='far fa-save'></i>
			{{localize 'QuickCombat.save'}}
		</button>
		<button class="actionButtons" data-action="addPlaylist">
			<i class='far fa-plus-square'></i>
			{{localize 'QuickCombat.add'}}
		</button>
	</footer>
</section>
